<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon compte</title>
</head>
<body>
    <div class="auth-bg d-flex justify-content-center align-items-center">
        <div class="auth p-4 text-white" style="max-width: 600px; width: 100%;">
            <h3 class="text-white mb-4 text-center">Mon compte</h3>

            <div class="d-flex flex-column gap-3">
                <div class="row g-3">
                    <div class="col-6">
                        <label class="text-white-50 small">Prénom</label>
                        <p class="text-white fw-bold mb-0" id="compte-prenom">—</p>
                    </div>

                <hr class="border-secondary"/>

                <div>
                    <label class="text-white-50 small">Email</label>
                    <p class="text-white fw-bold mb-0" id="compte-email">—</p>
                </div>
                <div>
                    <label class="text-white-50 small">Téléphone</label>
                    <p class="text-white fw-bold mb-0" id="compte-telephone">—</p>
                </div>
                <div>
                    <label class="text-white-50 small">Ville</label>
                    <p class="text-white fw-bold mb-0" id="compte-ville">—</p>
                </div>
                <div>
                    <label class="text-white-50 small">Pays</label>
                    <p class="text-white fw-bold mb-0" id="compte-pays">—</p>
                </div>
                <div>
                    <label class="text-white-50 small">Adresse postale</label>
                    <p class="text-white fw-bold mb-0" id="compte-adresse">—</p>
                </div>

                <hr class="border-secondary"/>

                <button class="btn btn-outline-danger w-100" id="btn-deconnexion-page">
                    <i class="bi bi-box-arrow-right"></i> Se déconnecter
                </button>
            </div>
        </div>
    </div>
</body>
</html>
