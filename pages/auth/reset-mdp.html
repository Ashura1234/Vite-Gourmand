<div class="auth-bg d-flex justify-content-center align-items-center">
  <div class="auth p-4 text-white" style="max-width: 520px; width: 100%">
    <h3 class="text-white mb-3 text-center">Mot de passe oublié</h3>
    <p class="text-white-50 text-center mb-4" id="reset-password-intro">
      Entrez votre adresse email pour recevoir un lien de réinitialisation.
    </p>

    <form id="forgot-password-form">
      <div class="mb-3">
        <label for="reset-email" class="form-label">Adresse email</label>
        <input
          type="email"
          class="form-control"
          id="reset-email"
          name="email"
          autocomplete="email"
          required
          placeholder="Entrez votre email"
        />
      </div>
      <button type="submit" class="btn btn-hero w-100">Recevoir le lien</button>
    </form>

    <form id="reset-password-form" class="d-none">
      <div class="mb-3">
        <label for="new-password" class="form-label"
          >Nouveau mot de passe</label
        >
        <input
          id="new-password"
          type="password"
          class="form-control"
          autocomplete="new-password"
          minlength="8"
          required
        />
      </div>
      <div class="mb-3">
        <label for="password-confirmation" class="form-label"
          >Confirmation</label
        >
        <input
          id="password-confirmation"
          type="password"
          class="form-control"
          autocomplete="new-password"
          minlength="8"
          required
        />
      </div>
      <button type="submit" class="btn btn-hero w-100">
        Modifier le mot de passe
      </button>
    </form>

    <p
      id="reset-password-message"
      class="mt-3 mb-0 text-center"
      role="status"
    ></p>
    <div class="text-center mt-3">
      <a href="/connexion" onclick="route(event)" class="text-secondary"
        >Retour à la connexion</a
      >
    </div>
  </div>
</div>
