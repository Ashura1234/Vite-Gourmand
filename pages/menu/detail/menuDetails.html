<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Détail menu</title>
  </head>
  <body>
    <div class="detail-page">
      <div class="container py-4">
        <h1 class="text-primary fw-bold" id="menuTitre"></h1>
        <div class="d-flex align-items-center gap-2 mt-2">
          <i class="bi bi-person-fill"></i>
          <span class="detail-price" id="menuPrix"></span>
        </div>
      </div>

      <div class="container">
        <div class="detail-img-wrapper">
          <div class="carousel-menu-img" id="menuImages"></div>
        </div>

        <div class="container py-3 mt-3">
          <div class="detail-tags" id="menuTags"></div>
        </div>

        <div class="container pb-5">
          <div id="menuPlats"></div>
        </div>

        <div class="detail-commander">
          <button
            class="btn btn-hero btn-commander"
            data-bs-toggle="modal"
            data-bs-target="#modalCommander"
          >
            Commander
          </button>
        </div>
      </div>
    </div>

    <div class="modal fade" id="modalCommander" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content modal-commande">
            <div class="modal-img-wrapper">
                <img id="modalImage" class="modal-img" alt="Menu"/>
            </div>

            <div class="modal-body modal-commande-body">
                <h4 class="text-white fw-bold" id="modalTitre"></h4>

                <div class="d-flex gap-2 mt-2 mb-4">
                    <span class="modal-badge" id="modalPrix">
                        <i class="bi bi-person-fill"></i>
                    </span>
                    <span class="modal-badge" id="modalStock">
                        <i class="bi bi-box-seam"></i>
                    </span>
                    <span class="modal-badge" id="modalTempsPreparation">
                        <i class="bi bi-stopwatch-fill"></i>
                    </span>
                </div>

                <div class="d-flex flex-column gap-3">
                    <input type="date" class="modal-input" id="inputDatePrestation"/>
                    <input type="time" class="modal-input" id="inputHeureLivraison"/>
                    <input type="number" class="modal-input" id="inputNombrePersonnes" placeholder="Nombre de personnes" min="1"/>
                    <div class="d-flex align-items-center gap-3">
                        <input type="checkbox" class="modal-checkbox" id="materiel"/>
                        <label for="materiel" class="modal-input flex-grow-1 mb-0">Prêt matériel</label>
                    </div>
                </div>

                <div id="commande-error" class="text-danger mt-2 d-none"></div>
                <div id="commande-success" class="text-success mt-2 d-none"></div>

                <div class="text-center mt-4">
                    <button class="btn btn-hero btn-commander" id="btnValiderCommande">
                        Valider et payer
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
  </body>
</html>
