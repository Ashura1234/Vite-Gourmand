<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
     <link rel="stylesheet" href="scss/main.css">
    <title>Vite & Gourmand </title>
</head>
<body>
        <header>
            <nav class="navbar navbar-expand-lg bg-primary" data-bs-theme="dark">
    <div class="container">
        <a class="navbar-brand" href="/" onclick="route(event)">
            Vite & Gourmand
        </a>

        <!-- Bouton hamburger mobile -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Liens -->
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/Vite-Gourmand/front/" onclick="route(event)">Accueil</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/Vite-Gourmand/front/menu" onclick="route(event)">Nos menus</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/Vite-Gourmand/front/contact" onclick="route(event)">Contact</a>
                </li>
            </ul>

            <!-- Connexion / Déconnexion -->
            <ul class="navbar-nav ms-auto" id="nav-auth">
                <!-- Si non connecté -->
                <li class="nav-item" id="nav-login">
                    <a class="nav-link btn btn-outline-primary px-3" href="/Vite-Gourmand/front/login" onclick="route(event)">Connexion <i class="bi bi-person-fill"></i></a>
                </li>
                <!-- Si connecté (masqué par défaut) -->
                <li class="nav-item d-none" id="nav-user">
                    <a class="nav-link" href="/Vite-Gourmand/front/compte" onclick="route(event)">Mon compte</a>
                </li>
                <li class="nav-item d-none" id="nav-logout">
                    <button class="btn btn-outline-danger px-3" id="btn-logout">Déconnexion</button>
                </li>
            </ul>
        </div>
    </div>
</nav>
        </header>

        <main id="main-page">
            <!--le futur contenu de la page-->
        </main>

        <footer>Le footer du site vite </footer>
        <script type="module" src="Router/Router.js"></script>
        <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
